name: Deploy to Lightsail

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "build.gradle*"
      - "settings.gradle*"
      - "gradle/**"
      - "gradlew"
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.prod.yml"
      - "deploy/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_IMAGE: dear-api:${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.LIGHTSAIL_HOST }}
      DEPLOY_USER: ubuntu
      SSH_PRIVATE_KEY_B64: ${{ secrets.LIGHTSAIL_SSH_PRIVATE_KEY_B64 }}
      PRODUCTION_ENV_FILE: ${{ secrets.PRODUCTION_ENV_FILE }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment secrets
        shell: bash
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$SSH_PRIVATE_KEY_B64"
          test -n "$PRODUCTION_ENV_FILE"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build application image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.APP_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure SSH
        shell: bash
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s' "$SSH_PRIVATE_KEY_B64" \
            | base64 --decode > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Upload deployment configuration
        shell: bash
        run: |
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          ssh "$target" 'sudo install -d -o "$USER" -g "$USER" /opt/dear4u /opt/dear4u/deploy'
          scp docker-compose.prod.yml "$target:/opt/dear4u/docker-compose.prod.yml"
          scp deploy/Caddyfile "$target:/opt/dear4u/deploy/Caddyfile"
          printf '%s\n' "$PRODUCTION_ENV_FILE" \
            | ssh "$target" 'umask 077; cat > /opt/dear4u/.env'

      - name: Transfer application image
        shell: bash
        run: |
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          docker save "$APP_IMAGE" \
            | gzip -1 \
            | ssh "$target" 'gunzip | sudo docker load'

      - name: Deploy and verify
        shell: bash
        run: |
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          ssh "$target" "APP_IMAGE='$APP_IMAGE' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          cd /opt/dear4u

          printf 'APP_IMAGE=%s\n' "$APP_IMAGE" > .deploy.env

          compose() {
            sudo docker compose \
              --env-file .env \
              --env-file .deploy.env \
              -f docker-compose.prod.yml \
              "$@"
          }

          if ! compose up -d --remove-orphans; then
            compose logs --tail=200
            exit 1
          fi

          healthy=false
          for attempt in $(seq 1 36); do
            if compose exec -T app curl -fsS http://localhost:8080/actuator/health >/dev/null; then
              healthy=true
              break
            fi
            echo "Waiting for application health check ($attempt/36)"
            sleep 5
          done

          if [ "$healthy" != true ]; then
            compose logs --tail=200 app
            exit 1
          fi

          compose ps
          sudo docker image prune -f
          REMOTE
