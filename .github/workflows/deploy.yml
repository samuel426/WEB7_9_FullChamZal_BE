name: Deploy to Lightsail

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "build.gradle*"
      - "settings.gradle*"
      - "gradle/**"
      - "gradlew"
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.prod.yml"
      - "deploy/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: dear-api

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=${REGISTRY}/${owner}/${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest=${REGISTRY}/${owner}/${IMAGE_NAME}:latest" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.image }}
            ${{ steps.image.outputs.latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build
    env:
      DEPLOY_HOST: ${{ secrets.LIGHTSAIL_HOST }}
      DEPLOY_USER: ubuntu
      SSH_PRIVATE_KEY: ${{ secrets.LIGHTSAIL_SSH_PRIVATE_KEY }}
      PRODUCTION_ENV_FILE: ${{ secrets.PRODUCTION_ENV_FILE }}
      GHCR_USERNAME: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment secrets
        shell: bash
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$PRODUCTION_ENV_FILE"
          test -n "$GHCR_USERNAME"
          test -n "$GHCR_TOKEN"

      - name: Configure SSH
        shell: bash
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Upload deployment configuration
        shell: bash
        run: |
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          ssh "$target" 'sudo install -d -o "$USER" -g "$USER" /opt/dear4u /opt/dear4u/deploy'
          scp docker-compose.prod.yml "$target:/opt/dear4u/docker-compose.prod.yml"
          scp deploy/Caddyfile "$target:/opt/dear4u/deploy/Caddyfile"
          printf '%s\n' "$PRODUCTION_ENV_FILE" \
            | ssh "$target" 'umask 077; cat > /opt/dear4u/.env'

      - name: Log in to GHCR on the server
        shell: bash
        run: |
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          printf '%s' "$GHCR_TOKEN" \
            | ssh "$target" "docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin"

      - name: Deploy and verify
        shell: bash
        env:
          APP_IMAGE: ${{ needs.build.outputs.image }}
        run: |
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          ssh "$target" "APP_IMAGE='$APP_IMAGE' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          cd /opt/dear4u

          printf 'APP_IMAGE=%s\n' "$APP_IMAGE" > .deploy.env

          compose() {
            docker compose \
              --env-file .env \
              --env-file .deploy.env \
              -f docker-compose.prod.yml \
              "$@"
          }

          compose pull

          if ! compose up -d --remove-orphans; then
            compose logs --tail=200
            exit 1
          fi

          healthy=false
          for attempt in $(seq 1 36); do
            if compose exec -T app curl -fsS http://localhost:8080/actuator/health >/dev/null; then
              healthy=true
              break
            fi
            echo "Waiting for application health check ($attempt/36)"
            sleep 5
          done

          if [ "$healthy" != true ]; then
            compose logs --tail=200 app
            exit 1
          fi

          compose ps
          docker image prune -f
          REMOTE
